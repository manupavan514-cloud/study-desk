<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inter Study Desk</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2ee;--panel:#fbfdfb;--ink:#13241c;--mute:#5f7168;--line:#d3ddd6;--acc:#1d6b4e;--acc-ink:#fff;--warn:#b8791a;--bar:#bcd3c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--panel:#17221c;--ink:#e6efe9;--mute:#90a499;--line:#2a3a31;--acc:#4fbf92;--acc-ink:#07140e;--warn:#e0a347;--bar:#2c4a3b}}
:root[data-theme="dark"]{--bg:#0f1713;--panel:#17221c;--ink:#e6efe9;--mute:#90a499;--line:#2a3a31;--acc:#4fbf92;--acc-ink:#07140e;--warn:#e0a347;--bar:#2c4a3b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;font-weight:800}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mute);padding:8px 14px;font:600 14px Figtree,sans-serif;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
nav{margin-bottom:14px;display:flex}
nav .seg{width:100%}nav .seg button{flex:1;padding:8px 4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.hide{display:none}
select,input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px Figtree,sans-serif;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.clock{font:800 clamp(64px,22vw,120px)/1 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:center;margin:18px 0 10px}
.prog{height:6px;background:var(--bar);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s linear}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:11px 18px;font:600 15px Figtree,sans-serif;cursor:pointer}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);flex:1;min-width:120px}
.mini{color:var(--mute);font-size:13px}
.today{margin-top:16px;display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.today b{color:var(--ink)}
.sub{border-top:1px solid var(--line);padding:14px 0}
.sub:first-of-type{border-top:0}
.sub h2{font-size:17px;font-weight:700}
.sub .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pct{display:flex;align-items:center;gap:10px;margin:8px 0}
.pct .prog{flex:1;margin:0}
.pct button{width:34px;height:34px;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:5px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.mock{width:84px!important;padding:6px 8px!important}
.grp{font:700 13px Figtree;color:var(--warn);margin:14px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin:10px 0 4px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.week i{width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}
.wl{display:flex;gap:8px}.wl span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;font-size:14px}
td:last-child,th:last-child{text-align:right}
details.sub summary{cursor:pointer;list-style:none}
details.sub summary::-webkit-details-marker{display:none}
.sn{font:700 17px "Bricolage Grotesque",sans-serif;display:block}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ch>span:first-child{flex:1;font-size:14px}
.ch .chips{flex:none}
input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px Figtree,sans-serif;flex:1;min-width:0}
.addc{display:flex;gap:8px;margin-top:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cg .w{text-align:center;font-size:12px;color:var(--mute)}
.cd{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--acc) var(--h),var(--panel));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 13px Figtree,sans-serif;cursor:pointer;padding:0}
.cd i{font-style:normal;font-size:11px;min-height:13px}
.cd.hot{color:var(--acc-ink)}
.cd.now{border:2px solid var(--warn)}
.cd.sel{outline:2px solid var(--ink);outline-offset:1px}
.ent{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.ch{flex-wrap:wrap}
.ch>span:first-child{flex:1 1 140px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:12px}
.sec b{font:700 15px "Bricolage Grotesque",sans-serif}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.pie{display:flex;justify-content:center;margin:14px 0 6px}
nav .seg{overflow-x:auto}
nav .seg button{flex:1 0 auto;padding:8px 10px;white-space:nowrap}
.nm{flex:1 1 130px;font-size:14px}
.edit{display:flex;gap:6px;width:100%;align-items:center}
.dd{padding:2px 0 10px 12px;border-left:2px solid var(--line);margin-left:8px}
textarea.note{width:100%;min-height:76px;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:400 14px Figtree,sans-serif;resize:vertical}
.chip.warn{background:#a3112b;border-color:#a3112b;color:#fff}
.tg{font:700 12px Figtree,sans-serif;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--warn)}
.cd.c0{background:#a3112b;border-color:#a3112b;color:#fff}
.cd.c1{background:#e3b23c;border-color:#e3b23c;color:#2a2000}
.cd.c2{background:#1f9d62;border-color:#1f9d62;color:#fff}
.cd.c3{background:linear-gradient(135deg,#f5b301,#e11d74 55%,#7c3aed);border-color:transparent;color:#fff}
.cd.c9{background:var(--bg)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.big2{font:800 40px/1 "Bricolage Grotesque",sans-serif}
input[type=date]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:500 14px Figtree,sans-serif}
.cd{position:relative}
.cd.hasev::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#4aa3ff;box-shadow:0 0 0 1.5px #0b1d2e}
.ch>span.grip{flex:none!important}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 8px;font-size:20px;line-height:1;color:var(--mute);border-radius:6px}
.grip:active{background:var(--bar)}
.dragging{opacity:.9;box-shadow:0 8px 22px rgba(0,0,0,.3);position:relative;z-index:5;background:var(--panel);border-radius:8px}
.dropat{outline:2px dashed var(--acc);outline-offset:-2px}
input[type=password],input[type=email]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px Figtree,sans-serif;flex:1;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 style="display:flex;align-items:center;gap:10px"><img id="avatar" alt="" width="34" height="34" style="border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff">Inter Study Desk</h1>
  <div class="seg" id="exam"><button data-e="CA">CA Inter</button><button data-e="CMA">CMA Inter</button></div>
</header><p style="text-align:center;font-size:13px;margin:6px 0">
  Built by <a href="https://www.linkedin.com/in/manopavansai" target="_blank" rel="noopener">Mano Pavan Sai on LinkedIn</a>
</p>

<nav><div class="seg" id="tabs"><button data-t="home">Home</button><button data-t="timer">Timer</button><button data-t="subjects">Subjects</button><button data-t="cal">Calendar</button><button data-t="rt">RTP/MTP</button><button data-t="log">Log</button><button data-t="settings">Settings</button></div></nav>
<div style="text-align:center;margin-bottom:10px"><button class="chip warn hide" id="stopa">■ Stop alarm</button></div>

<section class="panel hide" id="home"></section>
<section class="panel hide" id="timer">
  <div class="row">
    <div style="flex:2;min-width:150px"><select id="subj" aria-label="Subject"></select></div><div style="flex:1;min-width:100px"><select id="ty" aria-label="Type"><option value="">Type</option><option value="T">Theory</option><option value="P">Practical</option></select></div>
    <div class="seg" id="modes"><button data-m="50">Focus</button><button data-m="10">Break</button><button data-m="0">Stopwatch</button></div>
  </div>
  <div class="row" style="margin-top:10px"><label class="mini" for="mins">Minutes</label><input type="number" id="mins" min="1" max="240" value="50" style="width:90px"><button class="chip" id="snd" style="margin-left:auto">🔔 Sound on</button></div>
  <div class="clock" id="clock" role="timer">50:00</div>
  <div class="prog"><i id="bar"></i></div>
  <div class="mini" id="tmsg" style="text-align:center;min-height:18px;margin:-10px 0 10px" aria-live="polite"></div>
  <div class="row"><button class="btn p" id="go">Start</button><button class="btn" id="save">Save time</button><button class="btn" id="reset">Reset</button></div>
  <div class="today"><span>Today <b id="tToday">0h 0m</b></span><span id="tSubj"></span></div>
</section>

<section class="panel hide" id="subjects"></section>
<section class="panel hide" id="cal"></section>
<section class="panel hide" id="rt"></section>
<section class="panel hide" id="log"></section>
<section class="panel hide" id="settings"></section>
</div>

<script>
const SUBJ={
CA:[['ca1','Advanced Accounting',90,'Group 1'],['ca2','Corporate & Other Laws',70,'Group 1'],['ca3','Taxation',90,'Group 1'],['ca4','Cost & Management Accounting',95,'Group 2'],['ca5','Auditing & Ethics',80,'Group 2'],['ca6','FM & SM',90,'Group 2']],
CMA:[['cm1','Business Laws & Ethics',70,'Group 1'],['cm2','Financial Accounting',80,'Group 1'],['cm3','Direct & Indirect Taxation',80,'Group 1'],['cm4','Cost Accounting',90,'Group 1'],['cm5','Operations & Strategic Mgmt',60,'Group 2'],['cm6','Corporate Accounting & Auditing',80,'Group 2'],['cm7','FM & Business Data Analytics',80,'Group 2'],['cm8','Management Accounting',80,'Group 2']]};
const REV=['R1','R2','R3','Last day'];
let S={exam:'CA',tab:'timer',log:[],sub:{},ch:{},rt:{}};
try{const r=localStorage.getItem('isd1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.since)S.since=S.log.length?S.log.map(x=>x.d).sort()[0]:day0();
function day0(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const lsave=()=>{try{localStorage.setItem('isd1',JSON.stringify(S))}catch(e){}};
const save=()=>{lsave();syncSoon()};
/* app icon + profile picture */
const ICON_KEY='isd-icon';
const MONKEY='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" fill="#1d6b4e"/><circle cx="92" cy="262" r="60" fill="#7a4a24"/><circle cx="420" cy="262" r="60" fill="#7a4a24"/><circle cx="92" cy="262" r="34" fill="#e9b98a"/><circle cx="420" cy="262" r="34" fill="#e9b98a"/><circle cx="256" cy="262" r="172" fill="#8b5a2b"/><ellipse cx="256" cy="322" rx="128" ry="104" fill="#e9b98a"/><rect x="116" y="212" width="120" height="76" rx="28" fill="#111"/><rect x="276" y="212" width="120" height="76" rx="28" fill="#111"/><rect x="230" y="236" width="52" height="14" fill="#111"/><path d="M136 232l34-8M296 232l34-8" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".7"/><ellipse cx="256" cy="336" rx="36" ry="24" fill="#c98f62"/><circle cx="244" cy="334" r="6" fill="#5a3a1a"/><circle cx="268" cy="334" r="6" fill="#5a3a1a"/><path d="M190 378q66 52 132 0" stroke="#5a3a1a" stroke-width="13" fill="none" stroke-linecap="round"/></svg>');
const CA_ICON=(()=>{const q=document.querySelector('link[rel="apple-touch-icon"]'),a=(q&&q.href)||'';return {a,b:(window.m&&window.m.icons&&window.m.icons[1]&&window.m.icons[1].src)||a}})();
function applyIcon(ic){
  const q=s=>document.querySelector(s),a=q('link[rel="apple-touch-icon"]'),f=q('link[rel="icon"]');
  if(a)a.href=ic.a;if(f)f.href=ic.a;
  try{const m={name:'Inter Study Desk',short_name:'Study Desk',start_url:location.href,scope:location.href,display:'standalone',background_color:'#eef2ee',theme_color:'#1d6b4e',icons:[{src:ic.a,sizes:'180x180',type:'image/png'},{src:ic.b,sizes:'512x512',type:'image/png'}]};
    const old=q('link[rel="manifest"]');if(old)old.remove();
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
  const av=document.getElementById('avatar');if(av)av.src=ic.a;
  const pv=document.getElementById('icprev');if(pv)pv.src=ic.a;
}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('bad image'));i.src=src});
function imgToIcons(img){
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const mk=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n,n);const s=Math.min(w,h);x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,n,n);return c.toDataURL('image/png')};
  return {a:mk(180),b:mk(512)};
}
function iconMsg(s){const m=document.getElementById('icm');if(m)m.textContent=s}
function setIcon(ic,keep){
  applyIcon(ic);
  try{if(keep)localStorage.setItem(ICON_KEY,JSON.stringify(ic));else localStorage.removeItem(ICON_KEY);iconMsg('Icon changed. Delete the old Home Screen icon, then Share, Add to Home Screen again to get the new one.')}
  catch(e){iconMsg('Icon changed but could not be saved for next time.')}
}
async function setPreset(v){try{if(v==='ca')return setIcon(CA_ICON,false);setIcon(imgToIcons(await loadImg(MONKEY)),true)}catch(e){iconMsg('Could not load that icon.')}}
async function uploadIcon(f){
  if(!f)return;if(f.size>15e6){iconMsg('That image is over 15 MB. Pick a smaller one.');return}
  try{const du=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});setIcon(imgToIcons(await loadImg(du)),true)}
  catch(e){iconMsg('Could not read that image.')}
}
(function(){const av=document.getElementById('avatar');if(av)av.src=CA_ICON.a;try{const r=localStorage.getItem(ICON_KEY);if(r)applyIcon(JSON.parse(r))}catch(e){}})();
/* cloud sync: per-account data in the page database, local-first */
const CLOUD={url:'',key:''}; // optional: paste your Supabase Project URL and anon key here, or enter them in Settings
const SY={mode:'claude',unsub:null,col:null,uid:null,me:null,state:'off',msg:'',last:{},R:{},timer:null,hold:false,ready:false,synced:0};
const LOCALK=['log','tm','tab','seeded','tmf','snd','cu','lu','su','sc','sbu','sbk'];
function parts(){
  const core={};for(const k in S)if(!LOCALK.includes(k))core[k]=S[k];
  const p={core:JSON.stringify(core)},by={};
  S.log.forEach(x=>{const m=x.d.slice(0,7);(by[m]=by[m]||[]).push(x)});
  for(const m in by)p['log-'+m]=JSON.stringify(by[m]);
  return p;
}
function syncSoon(){if(!SY.col||SY.hold)return;clearTimeout(SY.timer);SY.timer=setTimeout(syncPush,1200)}
async function syncPush(){
  if(!SY.col||SY.hold)return;
  const p=parts();
  for(const k in SY.last)if(k.startsWith('log-')&&!(k in p))p[k]='[]';
  const u=Date.now();SY.state='ok';SY.msg='';
  try{
    for(const k in p){
      if(SY.last[k]===p[k])continue;
      if(p[k].length>230000){SY.state='err';SY.msg='Part of your data is too large to sync ('+k+').';continue}
      await SY.col.doc(k).set({u,d:p[k]});
      SY.last[k]=p[k];
      if(k==='core')S.cu=u;else(S.lu=S.lu||{})[k]=u;
    }
    if(SY.uid)S.su=SY.uid;lsave();
    if(SY.state==='ok')SY.synced=Date.now();
  }catch(e){SY.state='err';SY.msg='Sync failed: '+((e&&(e.message||e.code))||'unknown error')}
  drawSync();
}
function applyPart(k,v){
  if(k==='core'){const o=JSON.parse(v.d);for(const x in o)S[x]=o[x];S.cu=v.u}
  else if(k.startsWith('log-')){const m=k.slice(4);S.log=S.log.filter(x=>x.d.slice(0,7)!==m).concat(JSON.parse(v.d));(S.lu=S.lu||{})[k]=v.u}
  SY.last[k]=parts()[k]||'[]';
}
function adoptAll(){S.log=[];for(const k in SY.R)applyPart(k,SY.R[k]);if(SY.uid)S.su=SY.uid;SY.hold=false;SY.state='ok';SY.synced=Date.now();lsave();show();drawSync()}
function mergeLWW(){
  let ch=false;
  for(const k in SY.R){
    const lu=k==='core'?(S.cu||0):((S.lu||{})[k]||0);
    if(SY.R[k].u>lu){applyPart(k,SY.R[k]);ch=true}
    else if(SY.last[k]===undefined)SY.last[k]=SY.R[k].d;
  }
  SY.state='ok';SY.msg='';SY.synced=Date.now();
  if(ch){lsave();show()}
  syncSoon();drawSync();
}
function syncClaim(){
  if(SY.uid)S.su=SY.uid;S.cu=Date.now();S.lu={};
  Object.keys(parts()).forEach(k=>{if(k!=='core')S.lu[k]=S.cu});
  SY.last={};for(const k in SY.R)SY.last[k]=SY.R[k].d;
}
function syncChoose(w){
  if(w==='cloud'){adoptAll();return}
  syncClaim();SY.hold=false;SY.state='ok';syncPush();
}
function syncSwitch(){
  clearTimeout(SY.timer);try{SY.unsub&&SY.unsub()}catch(e){}
  SY.unsub=null;SY.col=null;SY.ready=false;SY.hold=true;SY.last={};SY.R={};SY.state='connecting';SY.msg='';
  drawSync();syncInit();
}
const CODE_RE=/^[A-Z0-9]{6,20}$/;
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const r=new Uint8Array(10);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.floor(Math.random()*256))}).getRandomValues(r);for(let i=0;i<10;i++)c+=a[r[i]%a.length];return c}
function codeConnect(){
  const el=document.getElementById('scin');const c=((el&&el.value)||'').toUpperCase().replace(/[\s-]/g,'');
  if(!CODE_RE.test(c)){const m=document.getElementById('scmsg');if(m)m.textContent='Use 6 to 20 letters or numbers.';return}
  S.sc=c;lsave();syncSwitch();
}
function codeOff(){delete S.sc;lsave();syncSwitch()}
/* own-website sync: Supabase email login + one table, same merge logic as above */
let SB=null,SBAUTH=false;
const SQLTXT=`create table if not exists isd_data (
  user_id uuid not null references auth.users(id) on delete cascade,
  k text not null, u bigint not null, d text not null,
  primary key (user_id, k)

  ${mk.length?H2('Marks vs target')+tbl(mk):''}
  ${H2(S.exam+' Inter target')}${tbl(tg.map(x=>[x[0],x[1]+'/'+x[2]]).concat([['<b>Total</b>','<b>'+(tg[0][1]+tg[1][1])+'/'+(tg[0][2]+tg[1][2])+'</b>']]))}
  ${H2('Chapters revised')}${tbl([0,1,2,3].map(k=>[k<3?'Revision '+(k+1):'Last-day',all.filter(x=>rv(x,k)).length+'/'+all.length]))}${tp('T')||tp('P')?`<p class="mini">${tp('T')}${tp('T')&&tp('P')?' · ':''}${tp('P')}</p>`:''}
`;
  drawSong();
}
function renderSettings(){
  $('settings').innerHTML=`${H2('Account & sync')}<div id="syncbox"></div>
  ${H2('App icon & profile picture')}<div class="row"><img id="icprev" alt="Current icon" width="64" height="64" style="border-radius:14px;border:1px solid var(--line);background:#fff" src="${(document.getElementById('avatar')||{}).src||''}"><div class="row" style="flex:1;min-width:180px"><button class="chip" data-a="icn" data-v="ca">CA India logo</button><button class="chip" data-a="icn" data-v="monkey">🐵 Cool monkey</button><label class="chip" for="icf" style="cursor:pointer">📷 Upload mine</label><input type="file" id="icf" accept="image/*" style="display:none"></div></div><p class="mini" id="icm">After changing it, delete the old icon from your Home Screen, then use Share, Add to Home Screen again.</p>
  ${H2('Backup')}<textarea id="bk" class="note" placeholder="Tap Export, copy the text and keep it safe. To restore, paste it here and tap Import."></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" data-a="exp">Export</button><button class="btn" data-a="imp">Import</button></div><p class="mini" id="bkm"></p>
  ${H2('Settings')}<p class="mini">Progress, sessions and timer settings save in this browser and sync to your account when you are signed in.</p><h2 style="font-size:15px;margin:16px 0 6px">Timer alarm</h2><div class="row"><label class="chip" for="songf" style="cursor:pointer">🎵 Choose alarm song</label><input type="file" id="songf" accept="audio/*" style="display:none"><button class="chip" data-a="songt">▶ Test</button><button class="chip" data-a="songs">■ Stop</button><button class="chip" data-a="songx">Default beep</button></div><p class="mini" id="songn" style="margin:6px 0 16px"></p><p class="mini" style="margin:0 0 8px">Reset Data also clears your cloud copy when you are signed in.</p><button class="btn" data-a="rst">Reset Data</button>`;
  drawSync();drawSong();
}
const homeClick=e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  if(b.dataset.a==='exp'){const s=JSON.stringify(S);$('bk').value=s;$('bk').select();try{navigator.clipboard.writeText(s)}catch(x){}$('bkm').textContent='Backup is in the box. Copy it if it was not copied automatically.'}
  else if(b.dataset.a==='icn')setPreset(b.dataset.v);
  else if(b.dataset.a==='syncn'){syncNow()}
  else if(b.dataset.a==='sbin')sbAuth('in');
  else if(b.dataset.a==='sbup')sbAuth('up');
  else if(b.dataset.a==='sbout')sbOut();
  else if(b.dataset.a==='sbsave')sbSave();
  else if(b.dataset.a==='scon')codeConnect();
  else if(b.dataset.a==='scoff')codeOff();
  else if(b.dataset.a==='scgen'){const el=document.getElementById('scin');if(el)el.value=genCode()}
  else if(b.dataset.a==='syncc')syncChoose('cloud');
  else if(b.dataset.a==='syncl')syncChoose('local');
  else if(b.dataset.a==='songt'){unlock();beep(true)}
  else if(b.dataset.a==='songs')stopSong();
  else if(b.dataset.a==='songx')songDefault();
  else if(b.dataset.a==='rst'){if(!RST){RST=true;b.textContent='Tap again to erase everything';return}RST=false;resetAll()}
  else if(b.dataset.a==='imp'){
    if(!IMP){IMP=true;$('bkm').textContent='Tap Import again to replace all current data with the pasted backup.';return}
    IMP=false;
    try{const o=JSON.parse($('bk').value);if(!Array.isArray(o.log))throw 0;const kc=S.sc,k1=S.sbu,k2=S.sbk;S=Object.assign({exam:'CA',tab:'home',log:[],sub:{},ch:{},rt:{}},o);S.sc=kc;S.sbu=k1;S.sbk=k2;syncClaim();save();show()}catch(x){$('bkm').textContent='That text is not a valid backup.'}
  }
};
$('home').addEventListener('click',homeClick);$('settings').addEventListener('click',homeClick);
const homeChange=e=>{if(e.target.id==='icf'){uploadIcon(e.target.files&&e.target.files[0]);e.target.value=''}else if(e.target.id==='songf'){pickSong(e.target.files&&e.target.files[0]);e.target.value=''}else if(e.target.dataset.a==='goal'){S.goal=Math.min(16,Math.max(1,+e.target.value||10));save();renderHome()}};
$('home').addEventListener('change',homeChange);$('settings').addEventListener('change',homeChange);
$('subjects').addEventListener('change',e=>{
  if(e.target.dataset.a==='mock'){sd(e.target.dataset.i).mock=e.target.value;save()}
  else if(e.target.dataset.a==='note'){chs(e.target.dataset.i)[+e.target.dataset.c].note=e.target.value;save()}
  else if(e.target.dataset.a==='sfin'){chs(e.target.dataset.i)[+e.target.dataset.c].fin=e.target.value;save();O[e.target.dataset.i]=true;renderSubjects()}
  else if(e.target.dataset.a==='fin'){sd(e.target.dataset.i).fin=e.target.value;save();renderSubjects()}
});
$('subjects').addEventListener('toggle',e=>{O[e.target.dataset.i]=e.target.open},true);

/* calendar */
let EE=null,CF2=null;
function evAct(b){
  const a=b.dataset.ev,k=+b.dataset.k,ev=S.ev||(S.ev=[]);
  if(a==='add'){const x=($('ne').value||'').trim();if(!x)return;ev.push({d:CD,t:x,tm:$('nt').value||''})}
  else if(a==='ed'){EE=k;CF2=null}
  else if(a==='no')EE=null;
  else if(a==='ok'){const x=($('eed').value||'').trim();if(x){ev[k].t=x;ev[k].tm=$('eet').value||''}EE=null}
  else if(a==='cf')CF2=k;
  else if(a==='del'){ev.splice(k,1);CF2=null}
  save();renderCal();
}
$('cal').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.id==='ne'?'add':e.target.id==='eed'?'ok':'';if(q){const o=document.querySelector('#cal [data-ev="'+q+'"]');if(o)o.click()}});
let CM=new Date();CM.setDate(1);let CD=day();
const nameOf=id=>{for(const k in SUBJ){const f=SUBJ[k].find(x=>x[0]===id);if(f)return f[1]}return id};
const pad=n=>String(n).padStart(2,'0');
function renderCal(){
  const y=CM.getFullYear(),m=CM.getMonth(),first=CM.getDay(),n=new Date(y,m+1,0).getDate();
  const tot={};S.log.forEach(x=>tot[x.d]=(tot[x.d]||0)+x.m);
  let cells='',mt=0,ds=0;const evd={};(S.ev||[]).forEach(e=>evd[e.d]=1);
  for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d),v=tot[k]||0;mt+=v;if(v)ds++;
    const T0=day(),cl=(k>T0||k<S.since||(v===0&&k===T0))?'c9':v>=720?'c3':v>=300?'c2':v>=60?'c1':'c0';
    cells+=`<button class="cd ${cl} ${k===CD?'sel':''} ${k===T0?'now':''} ${evd[k]?'hasev':''}" data-d="${k}"><b>${d}</b><i>${v?(v>=720?'🔥':'')+ +(v/60).toFixed(1)+'h':''}</i></button>`;
  }
  const ents=S.log.map((x,i)=>[x,i]).filter(a=>a[0].d===CD);
  const dt=ents.reduce((a,b)=>a+b[0].m,0);
  const lab=new Date(CD+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  $('cal').innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn" data-n="-1" aria-label="Previous month">‹</button><div style="text-align:center"><h2 style="font-size:19px">${CM.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><span class="mini">${hm(mt)} over ${ds} days</span></div><button class="btn" data-n="1" aria-label="Next month">›</button></div>
  <div class="cg">${[...'SMTWTFS'].map(x=>`<span class="w">${x}</span>`).join('')}${cells}</div>
  <div class="lg"><span><i class="dot" style="background:#1f9d62"></i>Productive 5h+</span><span><i class="dot" style="background:#e3b23c"></i>1 to 5h</span><span><i class="dot" style="background:#a3112b"></i>Under 1h / missed</span><span><i class="dot" style="background:#e11d74"></i>12h+ 🔥</span></div>
  <h2 style="font-size:17px;margin-top:18px">${lab} · ${hm(dt)}</h2>
  ${ents.length?ents.map(a=>`<div class="ent"><span>${esc(nameOf(a[0].s))}</span><span>${hm(a[0].m)} <button class="chip" data-x="${a[1]}" aria-label="Delete entry">×</button></span></div>`).join(''):'<p class="mini">Nothing logged. Use the timer or add hours below.</p>'}
  <div class="addc"><select id="cs" aria-label="Subject">${list().map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select><input type="number" id="cm" min="1" max="720" placeholder="Min" style="width:84px"><button class="btn" id="ca">Add</button></div>
  ${(()=>{const L=(S.ev||[]).map((e,i)=>[e,i]).filter(a=>a[0].d===CD).sort((a,b)=>(a[0].tm||'99').localeCompare(b[0].tm||'99'));
  return '<h2 style="font-size:17px;margin-top:20px">Events</h2>'+(L.length?L.map(a=>EE===a[1]?`<div class="ent"><span class="edit"><input type="time" id="eet" value="${a[0].tm||''}" style="width:110px"><input type="text" id="eed" value="${esc(a[0].t)}" maxlength="200"><button class="chip on" data-ev="ok" data-k="${a[1]}">Save</button><button class="chip" data-ev="no">Cancel</button></span></div>`:`<div class="ent"><span>${a[0].tm?'<b>'+a[0].tm+'</b> ':''}${esc(a[0].t)}</span><span class="chips"><button class="chip" data-ev="ed" data-k="${a[1]}" aria-label="Edit event">✎</button>${CF2===a[1]?`<button class="chip warn" data-ev="del" data-k="${a[1]}">Delete?</button>`:`<button class="chip" data-ev="cf" data-k="${a[1]}" aria-label="Delete event">×</button>`}</span></div>`).join(''):'<p class="mini">No events yet. Add one below, e.g. "Completed Costing Ch 5".</p>')+'<div class="addc"><input type="time" id="nt" aria-label="Time (optional)" style="width:110px"><input type="text" id="ne" placeholder="Add event…" maxlength="200"><button class="btn" data-ev="add">Add</button></div>'})()}`;
}
$('cal').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ev){evAct(b);return}
  if(b.dataset.n){CM.setMonth(CM.getMonth()+ +b.dataset.n);renderCal()}
  else if(b.dataset.d){CD=b.dataset.d;renderCal()}
  else if(b.dataset.x){S.log.splice(+b.dataset.x,1);save();renderCal()}
  else if(b.id==='ca'){const m=+$('cm').value;if(m>0){S.log.push({d:CD,s:$('cs').value,m});if(CD<S.since)S.since=CD;save();renderCal()}}
});

/* log */
const COL=['#1d9a6c','#d6931f','#3b82c4','#c2503f','#8a63c9','#2aa6b0','#a7a52c','#d1649a'];
let PER=S.per||'7';
function pie(data,tot){
  let s='',a=-Math.PI/2;
  const nz=data.filter(d=>d.v>0);
  if(nz.length===1)s=`<circle cx="100" cy="100" r="92" fill="${nz[0].c}"/>`;
  else nz.forEach(d=>{const b=a+d.v/tot*2*Math.PI,P=(r,q)=>(100+r*Math.cos(q)).toFixed(2)+' '+(100+r*Math.sin(q)).toFixed(2);
    s+=`<path d="M100 100L${P(92,a)}A92 92 0 ${b-a>Math.PI?1:0} 1 ${P(92,b)}Z" fill="${d.c}" stroke="var(--panel)" stroke-width="2"/>`;a=b});
  return `<svg viewBox="0 0 200 200" width="220" height="220" role="img" aria-label="Hours by subject">${s}<circle cx="100" cy="100" r="48" fill="var(--panel)"/><text x="100" y="98" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">${hm(tot)}</text><text x="100" y="117" text-anchor="middle" font-size="11" fill="var(--mute)">total</text></svg>`;
}
function renderLog(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>mins(x=>x.d===day(d)));
  const mx=Math.max(60,...vals);
  const streak=streakInfo().cur;
  const wk=vals.reduce((a,b)=>a+b,0);
  const wset=new Set(days.map(d=>day(d))),mp=day().slice(0,7);
  const ok={'1':d=>d===day(),'7':d=>wset.has(d),'M':d=>d.startsWith(mp),'A':()=>true}[PER];
  const data=list().map((s,i)=>({label:s[1],c:COL[i%COL.length],v:mins(x=>x.s===s[0]&&ok(x.d))}));
  const tot=data.reduce((a,x)=>a+x.v,0);
  const P=[['1','Today'],['7','7 days'],['M','Month'],['A','All time']];
  $('log').innerHTML=`<div class="stats"><div class="stat"><span class="mini">Today</span><b>${hm(vals[6])}</b></div><div class="stat"><span class="mini">7 days</span><b>${hm(wk)}</b></div><div class="stat"><span class="mini">Streak</span><b>${streak} d</b></div></div>
  <div class="week">${vals.map(v=>`<div title="${hm(v)}"><i style="height:${v/mx*100}%"></i></div>`).join('')}</div>
  <div class="wl">${days.map(d=>`<span>${'SMTWTFS'[d.getDay()]}</span>`).join('')}</div>
  <h2 style="font-size:17px;margin:20px 0 8px">Time by subject</h2>
  <div class="seg" id="per" style="display:flex">${P.map(q=>`<button style="flex:1;padding:8px 4px" data-p="${q[0]}" class="${PER===q[0]?'on':''}">${q[1]}</button>`).join('')}</div>
  ${tot?`<div class="pie">${pie(data,tot)}</div>`+[...data].sort((a,b)=>b.v-a.v).filter(d=>d.v>0).map(d=>`<div class="ent"><span><i class="dot" style="background:${d.c}"></i>${esc(d.label)}</span><span>${hm(d.v)} · ${Math.round(d.v/tot*100)}%</span></div>`).join(''):'<p class="mini" style="margin-top:14px">No hours logged in this period yet.</p>'}
  ${(()=>{const f=ty=>mins(x=>x.ty===ty&&wset.has(x.d)),a=f('T'),b=f('P'),z=a+b;return z?`<h2 style="font-size:17px;margin:20px 0 8px">Theory vs practical (7 days)</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span class="mini">Theory</span><b>${hm(a)}</b><span class="mini">${Math.round(a/z*100)}%</span></div><div class="stat"><span class="mini">Practical</span><b>${hm(b)}</b><span class="mini">${Math.round(b/z*100)}%</span></div></div>`:'<p class="mini" style="margin-top:18px">Pick Theory or Practical in the Timer to see your split here.</p>'})()}
  <div class="row" style="margin-top:18px"><button class="btn" id="clr">Clear all data</button></div>`;
  document.querySelectorAll('#per button').forEach(b=>b.onclick=()=>{PER=b.dataset.p;S.per=PER;save();renderLog()});
  $('clr').onclick=()=>{if(!CLR){CLR=true;$('clr').textContent='Tap again to delete everything';return}CLR=false;S.log=[];S.sub={};S.ch={};S.rt={};save();show()};
}

/* shell */
function show(){
  document.querySelectorAll('#exam button').forEach(b=>b.classList.toggle('on',b.dataset.e===S.exam));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  ['home','timer','subjects','cal','rt','log','settings'].forEach(t=>$(t).classList.toggle('hide',t!==S.tab));
  fillSelect();renderToday();
  if(S.tab==='subjects')renderSubjects();
  if(S.tab==='home')renderHome();
  if(S.tab==='rt')renderRt();
  if(S.tab==='cal')renderCal();
  if(S.tab==='log')renderLog();
  if(S.tab==='settings')renderSettings();
}
document.querySelectorAll('#exam button').forEach(b=>b.onclick=()=>{S.exam=b.dataset.e;save();show()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();show()});
const tm=Object.assign({},S.tm||{});
if(tm.st){[50,10,0].forEach(m=>{if(tm.st[m])Object.assign(ST[m],tm.st[m])})}
else{if(S.tmf)ST[50].total=S.tmf*60000;if(tm.mode!==undefined&&tm.run)Object.assign(ST[tm.mode],{run:1,start:tm.start||0,base:tm.base||0})}
setMode(tm.mode!==undefined?tm.mode:50);show();
if(tm.subj&&Array.from($('subj').options||[]).some(o=>o.value===tm.subj))$('subj').value=tm.subj;
$('ty').value=tm.ty||'';renderToday();drawSnd();loadSong();
setInterval(tick,250);tick();saveTimer();
syncInit();
window.addEventListener('pagehide',()=>{saveTimer()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveTimer()});
</script>
</body>
